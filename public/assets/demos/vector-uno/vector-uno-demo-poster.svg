  <text x="130" y="430" fill="#ffffff" font-family="Arial, sans-serif" font-size="78" font-weight="700">Vector Uno</text>
  <text x="130" y="500" fill="#94a3b8" font-family="Arial, sans-serif" font-size="34">Estrategia, diseño y tecnología conectados.</text>
