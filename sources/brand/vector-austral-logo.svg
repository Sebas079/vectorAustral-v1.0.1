<svg 
  xmlns="http://www.w3.org/2000/svg" 
  viewBox="0 0 500 120" 
  class="w-full h-auto text-slate-900 dark:text-white"
  fill="none"
>
  <defs>
    <!-- Gradiente de velocidad/vector -->
    <linearGradient id="va-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" /> <!-- Sky 600 -->
      <stop offset="100%" stop-color="#06B6D4" /> <!-- Cyan 500 -->
    </linearGradient>
  </defs>

  <!-- ISOTIPO (Símbolo V + A) -->
  <g transform="translate(10, 10)">
    <!-- Ala Izquierda - Estructura sólida -->
    <path 
      d="M 15 15 L 45 85 L 60 85 L 30 15 Z" 
      fill="currentColor" 
      class="opacity-90"
    />
    
    <!-- Ala Derecha - Vector dinámico con gradiente -->
    <path 
      d="M 45 85 L 85 15 L 70 15 L 35 70 Z" 
      fill="url(#va-gradient)" 
    />
    
    <!-- Flecha/Brújula Austral Central -->
    <polygon 
      points="50,25 60,50 50,42 40,50" 
      fill="#06B6D4" 
    />
  </g>

  <!-- LOGOTIPO (Texto Vector Austral) -->
  <g transform="translate(120, 72)">
    <!-- VECTOR -->
    <text 
      x="0" 
      y="0" 
      font-family="system-ui, -apple-system, sans-serif" 
      font-size="42" 
      font-weight="800" 
      letter-spacing="-1.5" 
      fill="currentColor"
    >
      VECTOR
    </text>
    
    <!-- AUSTRAL -->
    <text 
      x="180" 
      y="0" 
      font-family="system-ui, -apple-system, sans-serif" 
      font-size="42" 
      font-weight="300" 
      letter-spacing="1" 
      fill="#06B6D4"
    >
      AUSTRAL
    </text>
  </g>
</svg>
